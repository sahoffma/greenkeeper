[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]
  included_files = ["shared/**", "node_modules/@img/**"]

[dev]
  command = "npm run dev"
  targetPort = 5173
  envFiles = [".env.local", ".env"]
